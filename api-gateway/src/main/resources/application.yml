spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 100MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: team-service
          uri: lb://team-service
          predicates:
            - Path=/api/teams/**, /api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
            - JwtAuthenticationFilter

        - id: sprint-service
          uri: lb://sprint-service
          predicates:
            - Path=/api/sprints/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
            - JwtAuthenticationFilter

        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/api/tasks/**, /api/artifacts/**, /api/comments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
            - JwtAuthenticationFilter

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
            - JwtAuthenticationFilter

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: localhost

jwt:
  secret: ${JWT_SECRET:sprint-approve-secret-key-change-this-in-production-minimum-256-bits-required-for-hs256-algorithm}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
