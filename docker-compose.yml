version: '3.8'

services:
  # PostgreSQL для team-service
  team-db:
    image: postgres:15-alpine
    container_name: team-db
    environment:
      POSTGRES_DB: team_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - team-db-data:/var/lib/postgresql/data
    networks:
      - sprint-approve-network

  # PostgreSQL для sprint-service
  sprint-db:
    image: postgres:15-alpine
    container_name: sprint-db
    environment:
      POSTGRES_DB: sprint_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - sprint-db-data:/var/lib/postgresql/data
    networks:
      - sprint-approve-network

  # PostgreSQL для task-service
  task-db:
    image: postgres:15-alpine
    container_name: task-db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data
    networks:
      - sprint-approve-network

  # MinIO для хранения файлов
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console (Web UI)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - sprint-approve-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  team-db-data:
  sprint-db-data:
  task-db-data:
  minio-data:

networks:
  sprint-approve-network:
    driver: bridge
